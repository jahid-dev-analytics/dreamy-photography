<style>
/* The tokens this page uses, copied from index.html. If you change a colour
   or a size there, change it here too — same rule as design/tokens.css. */
:root{
  --paper:#f4f4f1; --ink:#16161a; --ink-muted:#6e6e68; --rule:#dcdcd6;
  --accent:#1f3bef;
  --f-sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-mast:"Anton",var(--f-sans);
  --t-micro:0.6875rem; --t-lead:1.25rem;
  --t-display:clamp(3rem,8.4vw,6.5rem);
  --track-tight:-.03em; --track-label:.13em;
  --gutter:clamp(1.25rem,3.4vw,3rem);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-sans);
  min-height:100svh; display:grid; grid-template-rows:auto 1fr auto;
  padding:0 var(--gutter); -webkit-font-smoothing:antialiased;
}
.rule{height:2px;background:var(--accent);width:3.5rem;margin:0 0 var(--s,1.5rem)}
.mast{display:flex;align-items:baseline;gap:.65rem;padding:1.75rem 0}
.mast a{font-family:var(--f-mast);font-size:1.35rem;letter-spacing:.01em;
  text-transform:uppercase;color:var(--ink);text-decoration:none}
.mast .dot{color:var(--accent)}
main{display:flex;flex-direction:column;justify-content:center;max-width:44rem;
  padding:2rem 0 4rem}
.label{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--ink-muted);margin:0 0 1.25rem}
h1{font-family:var(--f-mast);font-size:var(--t-display);line-height:.92;
  letter-spacing:var(--track-tight);text-transform:uppercase;margin:0 0 1.5rem}
p{font-size:var(--t-lead);line-height:1.5;color:var(--ink-muted);margin:0 0 2rem;
  max-width:34rem}
.go{display:inline-flex;align-self:flex-start;align-items:center;gap:.5rem;font-family:var(--f-mono);
  font-size:.875rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);
  text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:.35rem}
.go:hover{color:var(--accent)}
footer{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--ink-muted);border-top:1px solid var(--rule);
  padding:1.25rem 0}
</style>
</head>
<body>

<!-- Links are absolute: this page is served both from GitHub Pages under
     /dreamy-photography/ and from Cloudflare Pages at the domain root, and
     one root-relative path cannot be right in both places. -->
<header class="mast">
  <a href="https://jahid-dev-analytics.github.io/dreamy-photography/">Dreamy<span class="dot">.</span></a>
</header>

<main>
  <div class="rule"></div>
  <p class="label">Error 404</p>
  <h1>The cloud took this one.</h1>
  <p>There is no page at that address. It may have been renamed, or the link that
     brought you here was mistyped.</p>
  <a class="go" href="https://jahid-dev-analytics.github.io/dreamy-photography/">Back to the journal &rarr;</a>
</main>

<footer>Jahidul Islam &nbsp;/&nbsp; Bandarban, November 2025</footer>

</body>
</html>
